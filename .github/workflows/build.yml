name: Build

on:
  push:
    branches: [ "**" ]
    # Pushing a tag like v1.0.0 builds the APKs and publishes a GitHub Release with them.
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SING_BOX_VERSION: v1.14.4
  NDK_VERSION: 28.0.13004108

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # needed to create the GitHub Release on tag builds
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      # The runner image already ships the Android SDK; just add what we need.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.1.0" "ndk;${NDK_VERSION}"

      - name: Cache libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-${{ hashFiles('scripts/build-libbox.sh') }}

      - name: Build sing-box core (libbox.aar)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          scripts/build-libbox.sh

      - uses: gradle/actions/setup-gradle@v5

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble release APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: navalny-vpn-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: libbox-aar
          path: app/libs/libbox.aar

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$f" .apk)"; abi="${abi#app-}"; abi="${abi%-release}"
            cp "$f" "dist/NavalnyVPN-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES=".github/release-notes/default.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Navalny VPN ${VERSION}" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"
